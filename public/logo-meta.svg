      <stop offset="1" stop-color="#FF5722"/>
    </linearGradient>
    <linearGradient id="cupOrange" x1="28" y1="20" x2="28" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="baseOrange" x1="28" y1="44" x2="28" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFA000"/>
