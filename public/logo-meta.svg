    <rect x="24.5" y="36.5" width="7" height="7" rx="2.2" fill="#FFA000" stroke="#FF5722" stroke-width="0.9"/>
    <!-- Socle -->
    <rect x="22" y="43.5" width="12" height="5" rx="2.2" fill="url(#baseOrange)" stroke="#FF9800" stroke-width="1.1"/>
