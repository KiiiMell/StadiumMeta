    <!-- Anses -->
    <path d="M16 32 Q10 26 18 22" stroke="#FFA000" stroke-width="2.2" fill="none"/>
    <path d="M40 32 Q46 26 38 22" stroke="#FFA000" stroke-width="2.2" fill="none"/>
    <!-- Coupe principale -->
    <path d="M18 22 Q28 14 38 22 Q38 32 28 36 Q18 32 18 22 Z" fill="url(#cupOrange)" stroke="#FFA000" stroke-width="1.6"/>
