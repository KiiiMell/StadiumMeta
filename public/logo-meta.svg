  </defs>
  <!-- Couronne orange sobre -->
  <g>
    <path d="M18 10 L28 4 L38 10 L36 18 L20 18 Z" fill="url(#orange)" stroke="#FFA000" stroke-width="1.4"/>
    <circle cx="28" cy="8" r="1.6" fill="#FFD54F" stroke="#FFA000" stroke-width="0.7"/>
  </g>
  <!-- Ailes robotiques -->
  <g>
    <path d="M6 28 Q0 20 14 14 Q18 12 23 14" stroke="#2196F3" stroke-width="2.4" fill="none"/>
    <path d="M50 28 Q56 20 42 14 Q38 12 33 14" stroke="#2196F3" stroke-width="2.4" fill="none"/>
    <path d="M8 38 Q2 44 18 48 Q22 50 25 46" stroke="#2196F3" stroke-width="1.7" fill="none"/>
    <path d="M48 38 Q54 44 38 48 Q34 50 31 46" stroke="#2196F3" stroke-width="1.7" fill="none"/>
  </g>
  <!-- Cercle principal -->
