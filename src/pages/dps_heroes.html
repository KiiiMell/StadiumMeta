<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Héros DPS - Stadium Meta</title>
  <link href="/favicon.ico" rel="icon" />
  <style>
    body {
      background: #161d26;
      font-family: 'Montserrat', Arial, sans-serif;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 160px;
      margin-bottom: 24px;
    }
    .role-title-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 36px;
    }
    .role-logo-sobre {
      width: 38px;
      height: 38px;
      filter: drop-shadow(0 0 8px #2196F3cc) drop-shadow(0 0 10px #FFA00099);
      vertical-align: middle;
    }
    .role-title-main {
      font-size: 2.3rem;
      font-family: 'Bebas Neue', Arial, sans-serif;
      font-weight: 900;
      color: #FFA000;
      text-shadow: 0 2px 14px #2196F3cc, 0 0px 18px #FFA00099, 0 0 1px #2196F3;
      text-transform: uppercase;
      margin: 0;
      padding: 0 8px;
      line-height: 1;
      display: inline-block;
    }
    .dps-hero-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 32px 36px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .dps-hero-card {
      background: #232b36;
      border-radius: 14px;
      box-shadow: 0 2px 10px #00eaff33;
      padding: 1.2rem 1.1rem 1.1rem 1.1rem;
      width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid #3cefff33;
      transition: transform 0.18s;
      text-align: center;
    }
    .dps-hero-card:hover {
      transform: translateY(-6px) scale(1.035);
      box-shadow: 0 4px 18px #00eaff66;
      border-color: #FFA000;
    }
    .dps-hero-img {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 14px;
      border: 2px solid #FFA00055;
      background: #181f25;
      box-shadow: 0 0 10px #2196F355;
    }
    .dps-hero-name {
      font-size: 1.17rem;
      font-weight: 700;
      color: #FFA000;
      letter-spacing: 1.2px;
      margin-bottom: 2px;
      text-shadow: 0 2px 8px #FFA00077, 0 0px 12px #fff2;
      text-transform: uppercase;
    }
    .dps-hero-role {
      font-size: 1.02rem;
      color: #ffcc80;
      font-weight: 500;
      margin-bottom: 10px;
    }
    .dps-hero-btn {
      display: inline-block;
      padding: 7px 18px;
      background: #2196F3;
      color: #fff;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.01rem;
      text-decoration: none;
      margin-top: 8px;
      transition: background 0.18s;
      box-shadow: 0 2px 8px #2196F355;
    }
    .dps-hero-btn:hover {
      background: #FFA000;
      color: #232b36;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <section class="hero-section">
    <div class="role-title-row">
      <img src="/images/ICONES_ROLES/Dark_Circle_Damage.png" alt="Logo Dégâts" class="role-logo-sobre" />
      <span class="role-title-main">DÉGÂTS</span>
    </div>
  </section>
  <main>
    <div class="dps-hero-grid">
      <div class="dps-hero-card">
        <img src="/images/PERSO_FULL/cassidy.png" alt="Cassidy" class="dps-hero-img" />
        <div class="dps-hero-name">Cassidy</div>
        <div class="dps-hero-role">DPS</div>
        <a href="/heroes/cassidy.html" class="dps-hero-btn">Détails du build</a>
      </div>
      <div class="dps-hero-card">
        <img src="/images/PERSO_FULL/ashe.png" alt="Ashe" class="dps-hero-img" />
        <div class="dps-hero-name">Ashe</div>
        <div class="dps-hero-role">DPS</div>
        <a href="/heroes/ashe.html" class="dps-hero-btn">Détails du build</a>
      </div>
      <div class="dps-hero-card">
        <img src="/images/PERSO_FULL/genji.png" alt="Genji" class="dps-hero-img" />
        <div class="dps-hero-name">Genji</div>
        <div class="dps-hero-role">DPS</div>
        <a href="/heroes/genji.html" class="dps-hero-btn">Détails du build</a>
      </div>
      <div class="dps-hero-card">
        <img src="/images/PERSO_FULL/reaper.png" alt="Reaper" class="dps-hero-img" />
        <div class="dps-hero-name">Reaper</div>
        <div class="dps-hero-role">DPS</div>
        <a href="/heroes/reaper.html" class="dps-hero-btn">Détails du build</a>
      </div>
      <div class="dps-hero-card">
        <img src="/images/PERSO_FULL/soldier76.png" alt="Soldier: 76" class="dps-hero-img" />
        <div class="dps-hero-name">Soldier: 76</div>
        <div class="dps-hero-role">DPS</div>
        <a href="/heroes/soldier76.html" class="dps-hero-btn">Détails du build</a>
      </div>
      <div class="dps-hero-card">
        <img src="/images/PERSO_FULL/mei.png" alt="Mei" class="dps-hero-img" />
        <div class="dps-hero-name">Mei</div>
        <div class="dps-hero-role">DPS</div>
        <a href="/heroes/mei.html" class="dps-hero-btn">Détails du build</a>
      </div>
      <!-- Ajoute ici d'autres héros DPS si besoin -->
    </div>
  </main>
</body>
</html>
